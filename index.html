<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <meta name="description" content="ModelTide - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ModelTide" />
    <meta property="og:description" content="ModelTide - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ModelTide" />
    <meta
      name="twitter:description"
      content="ModelTide - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析"
    />
    <title>ModelTide</title>
    <style>
      html {
        background: #fafbfc;
      }
      html.dark {
        background: #1a1a1a;
      }
    </style>
    <script>
      (function () {
        var stored = null,
          lang = null;
        try {
          var raw = localStorage.getItem("settings");
          if (raw) {
            var p = JSON.parse(raw);
            var st = p && p.state;
            if (st && (st.themeMode === "dark" || st.themeMode === "light")) stored = st.themeMode;
            if (st && (st.lang === "zh" || st.lang === "en")) lang = st.lang;
          }
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored == null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var metas = document.querySelectorAll("meta[name='theme-color']");
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#1a1a1a" : "#fafbfc");
        var nav = typeof navigator !== "undefined" && navigator.language ? navigator.language : "";
        var resolved = lang || (/^en/i.test(nav) ? "en" : "zh");
        document.documentElement.lang = resolved === "zh" ? "zh-CN" : "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
