<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="ModelTide - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ModelTide" />
    <meta property="og:description" content="ModelTide - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="/icons/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ModelTide" />
    <meta
      name="twitter:description"
      content="ModelTide - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析"
    />
    <title>ModelTide</title>
    <style>
      html {
        background: #ffffff;
      }
      html.dark {
        background: #000000;
      }
    </style>
    <script>
      // Theme/lang init before first paint (read the zustand persist shape),
      // avoiding a flash of the wrong color scheme. Mirrors the settings store.
      (function () {
        try {
          var raw = localStorage.getItem("settings");
          var stored = null,
            lang = null;
          if (raw) {
            var p = JSON.parse(raw);
            var st = p && p.state;
            if (st && (st.themeMode === "dark" || st.themeMode === "light")) stored = st.themeMode;
            if (st && (st.lang === "zh" || st.lang === "en")) lang = st.lang;
          }
          var dark =
            stored === "dark" ||
            (stored == null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var m = document.querySelector("meta[name='theme-color']");
          if (m) m.setAttribute("content", dark ? "#000000" : "#ffffff");
          if (lang) document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
