<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AITIWETA - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <meta name="theme-color" content="#ffffff" />
    <title>AITIWETA</title>
    <!-- Social share previews (kept static; the dashboard itself is client-rendered). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AITIWETA" />
    <meta property="og:description" content="AITIWETA - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <meta property="og:image" content="/icons/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AITIWETA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved/OS theme before first paint to avoid a light/dark flash on load.
      // NOTE: this inline block is allowlisted in public/_headers via its sha256 hash;
      // if you edit it, regenerate the hash with `npm run hash:csp`.
      (function () {
        var stored = null;
        try {
          var raw = localStorage.getItem("theme");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.state.themeMode === "dark" || parsed.state.themeMode === "light")) {
              stored = parsed.state.themeMode;
            }
          }
        } catch (e) {}
        var dark = stored === "dark" || (stored == null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
        }
        var meta = document.querySelector("meta[name='theme-color']");
        if (meta) {
          meta.setAttribute("content", dark ? "#090a0b" : "#ffffff");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
