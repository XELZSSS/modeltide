<!doctype html>
<html lang="%MT_DOC_LANG%">
  <head>
    <!-- Do not add security policy here (CSP / X-Frame-Options / HSTS as meta equivalents): Cloudflare Pages owns the
         edge policy. See AGENTS.md. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta
      name="description"
      content="ModelTide - AI model data dashboard: rankings, benchmarks, pricing and releases"
    />
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ModelTide" />
    <meta
      property="og:description"
      content="ModelTide - AI model data dashboard: rankings, benchmarks, pricing and releases"
    />
    <meta property="og:locale" content="%MT_DOC_LOCALE%" />
    <meta property="og:locale:alternate" content="%MT_DOC_LOCALE_ALTERNATE%" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ModelTide" />
    <meta
      name="twitter:description"
      content="ModelTide - AI model data dashboard: rankings, benchmarks, pricing and releases"
    />
    <title>ModelTide</title>
    <style>
      html {
        background: #ffffff;
      }

      html.dark {
        background: #09090b;
      }
    </style>
    <script>
      (function () {
        var boot = %MT_BOOT%;
        var stored = null,
          lang = null;
        try {
          var raw = localStorage.getItem(boot.storageKey);
          if (raw) {
            var p = JSON.parse(raw);
            var st = p && p.version === boot.storageVersion ? p.state : null;
            if (st && boot.themeModes.indexOf(st.themeMode) !== -1) stored = st.themeMode;
            if (st && boot.languages.indexOf(st.lang) !== -1) lang = st.lang;
          }
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var metas = document.querySelectorAll("meta[name='theme-color']");
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#09090b" : "#ffffff");
        var nav = typeof navigator !== "undefined" && navigator.language ? navigator.language : "";
        var resolved = lang || (/^en/i.test(nav) ? "en" : "zh");
        document.documentElement.lang = boot.docLang[resolved];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
